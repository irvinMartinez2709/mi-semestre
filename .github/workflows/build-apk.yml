name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Install Capacitor CLI
        working-directory: web
        run: npm install --no-save @capacitor/cli

      - name: Add Android platform
        working-directory: web
        run: npx cap add android

      - name: Sync Android
        working-directory: web
        run: npx cap sync android

      - name: Write app icons directly (no @capacitor/assets)
        working-directory: web
        run: |
          npm install --no-save sharp
          node scripts/generar-iconos.mjs

      - name: Build debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mi-semestre-apk
          path: |
            web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: "Mi Semestre APK"
          tag_name: "apk-${{ github.run_number }}"
          files: web/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
